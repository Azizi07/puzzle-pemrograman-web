>diawali</b> teks itu.' },\n  { st: 2, sc: 'B', sel: 'a[href^=\"#\"]', goal: 'Tembak <b>tautan internal</b> (alamatnya diawali tanda #).',\n    hint: 'Sama seperti sebelumnya, tetapi nilainya \"#\" (beri tanda kutip).',\n    note: 'Nilai di dalam <code>[ ]</code> sebaiknya diberi tanda kutip, misalnya <code>[href^=\"#\"]</code>.' },\n  { st: 2, sc: 'B', sel: '[disabled]', goal: 'Tembak elemen yang <b>memiliki atribut</b> <code>disabled</code>.',\n    hint: 'Cukup tulis nama atributnya di dalam [ ], tanpa nilai.',\n    note: '<code>[atribut]</code> tanpa nilai = elemen yang <b>memiliki</b> atribut itu.' },\n  { st: 2, sc: 'C', sel: 'input[type=\"text\"]', goal: 'Tembak semua <code>input</code> bertipe <b>text</b>.',\n    hint: 'Pakai [type=\"text\"] dan tulis tag input di depannya.',\n    note: '<code>[atribut=\"nilai\"]</code> = nilainya <b>persis sama</b>.' },\n  { st: 2, sc: 'C', sel: 'input[name$=\"a\"]', goal: 'Tembak <code>input</code> yang atribut <code>name</code>-nya <b>berakhiran huruf a</b>.',\n    hint: 'Tanda $= artinya \"diakhiri dengan\".',\n    note: '<code>[atribut$=\"nilai\"]</code> = nilai atribut <b>diakhiri</b> teks itu.' },\n  { st: 2, sc: 'C', sel: 'input[name*=\"s\"]', goal: 'Tembak <code>input</code> yang atribut <code>name</code>-nya <b>mengandung huruf s</b>.',\n    hint: 'Tanda *= artinya \"mengandung\".',\n    note: '<code>[atribut*=\"nilai\"]</code> = nilai atribut <b>mengandung</b> teks itu di posisi mana pun.' },\n\n  /* ---- Tahap 4: Pseudo-class ---- */\n  { st: 3, sc: 'C', sel: 'input:checked', goal: 'Tembak <code>input</code> yang sedang <b>tercentang</b>.',\n    hint: 'Pseudo-class diawali titik dua (:). Cari yang artinya \"tercentang\".',\n    note: '<code>:checked</code> memilih checkbox/radio yang tercentang.' },\n  { st: 3, sc: 'C', sel: 'input:disabled', goal: 'Tembak <code>input</code> yang <b>dinonaktifkan</b>.',\n    hint: 'Pseudo-class :disabled.',\n    note: '<code>:disabled</code> memilih elemen formulir yang dinonaktifkan. Lawannya <code>:enabled</code>.' },\n  { st: 3, sc: 'C', sel: 'input:required', goal: 'Tembak <code>input</code> yang <b>wajib diisi</b>.',\n    hint: 'Pseudo-class :required.',\n    note: '<code>:required</code> memilih input yang memiliki atribut <code>required</code>.' },\n  { st: 3, sc: 'A', sel: 'li:first-child', goal: 'Tembak item list yang <b>pertama</b>.',\n    hint: 'Pseudo-class :first-child.',\n    note: '<code>:first-child</code> = elemen yang menjadi <b>anak pertama</b> dari induknya.' },\n  { st: 3, sc: 'A', sel: 'li:last-child', goal: 'Tembak item list yang <b>terakhir</b>.',\n    hint: 'Pseudo-class :last-child.',\n    note: '<code>:last-child</code> = elemen yang menjadi <b>anak terakhir</b> dari induknya.' },\n  { st: 3, sc: 'D', sel: 'tbody tr:nth-child(odd)', goal: 'Tembak <b>baris ganjil</b> (1, 3, 5) pada isi tabel (<code>tbody</code>), bukan header.',\n    hint: 'Gunakan :nth-child(odd) pada tr, dan batasi di dalam tbody.',\n    note: '<code>:nth-child(odd)</code> = urutan ganjil, <code>even</code> = genap. Bisa juga rumus seperti <code>2n+1</code>.' },\n  { st: 3, sc: 'D', sel: 'tbody td:last-child', goal: 'Tembak <b>sel terakhir di setiap baris</b> isi tabel.',\n    hint: ':last-child pada td, di dalam tbody.',\n    note: '<code>:last-child</code> dihitung <b>per induk</b>, jadi setiap baris punya satu sel terakhir.' },\n  { st: 3, sc: 'D', sel: 'tbody tr:not(.remedial)', goal: 'Tembak baris isi tabel yang <b>bukan</b> berkelas <code>remedial</code>.',\n    hint: ':not( ) mengecualikan selector di dalam kurungnya.',\n    note: '<code>:not(selector)</code> = <b>kecualikan</b> elemen yang cocok dengan selector di dalamnya.' },\n  { st: 3, sc: 'B', sel: '.proyek:nth-child(2)', goal: 'Tembak proyek yang <b>kedua</b>.',\n    hint: ':nth-child(2) pada class proyek.',\n    note: '<code>:nth-child(n)</code> memilih anak ke-n. Angka 2 berarti anak kedua.' },\n  { st: 3, sc: 'B', sel: '.proyek:last-child h3', goal: 'Tembak <b>judul (h3)</b> dari proyek yang <b>terakhir</b>.',\n    hint: 'Pilih proyek terakhir dulu, lalu beri spasi dan tag h3.',\n    note: 'Pseudo-class bisa digabung dengan keturunan: pilih induknya dulu, lalu turun ke elemen di dalamnya.' },\n\n  /* ---- Tahap 5: Master ---- */\n  { st: 4, sc: 'B', sel: '.proyek .label:not(.baru)', goal: 'Tembak <code>.label</code> di dalam proyek yang <b>bukan</b> label <code>baru</code>.',\n    hint: 'Keturunan (spasi) lalu :not(.baru).',\n    note: 'Gabungan <b>keturunan + :not</b>.' },\n  { st: 4, sc: 'B', sel: '.menu a:not(.aktif)[href^=\"https\"]', goal: 'Tembak tautan menu yang <b>tidak aktif</b> <i>dan</i> alamatnya <b>diawali https</b>.',\n    hint: 'Satu elemen boleh memiliki beberapa syarat berurutan tanpa spasi: a:not(...)[...]',\n    note: 'Syarat boleh <b>ditumpuk</b> tanpa spasi: tag, pseudo-class, dan atribut sekaligus.' },\n  { st: 4, sc: 'B', sel: '.hero .tombol:not([disabled])', goal: 'Tembak tombol di dalam <code>.hero</code> yang <b>tidak</b> disabled.',\n    hint: 'Di dalam :not( ) boleh memakai selector atribut.',\n    note: '<code>:not([atribut])</code> = elemen yang <b>tidak punya</b> atribut itu.' },\n  { st: 4, sc: 'A', sel: 'li:not(:first-child)', goal: 'Tembak <b>semua item list kecuali yang pertama</b>.',\n    hint: 'Ada dua cara: :not(:first-child) atau :nth-child(n+2).',\n    note: 'Banyak cara benar. <code>li:nth-child(n+2)</code> juga memilih anak ke-2 dan seterusnya.' },\n  { st: 4, sc: 'D', sel: 'tbody tr:nth-child(even) td:first-child', goal: 'Tembak <b>sel nama</b> (sel pertama) pada <b>baris genap</b> isi tabel.',\n    hint: 'Baris genap dulu, lalu turun ke td:first-child.',\n    note: 'Gabungan <b>nth-child</b> pada baris, lalu <b>first-child</b> pada sel di dalamnya.' },\n  { st: 4, sc: 'C', sel: 'input:not([type=\"checkbox\"]):not(:disabled)', goal: 'Tembak <code>input</code> yang <b>bukan checkbox</b> dan <b>tidak disabled</b>.',\n    hint: ':not( ) boleh dipakai berkali-kali berurutan.',\n    note: '<b>:not berantai</b>: setiap :not menambah satu pengecualian.' }\n];\n\n\n(function () {\n  'use strict';\n  const $ = s => document.querySelector(s);\n  const el = (t, p, ...k) => { const e = document.createElement(t); if (p) for (const a in p) { if (a === 'class') e.className = p[a]; else if (a === 'html') e.innerHTML = p[a]; else if (a.slice(0, 2) === 'on') e.addEventListener(a.slice(2), p[a]); else if (p[a] !== false && p[a] != null) e.setAttribute(a, p[a]); } k.flat().forEach(c => c != null && e.append(c.nodeType ? c : document.createTextNode(c))); return e; };\n  const esc = s => String(s).replace(/[&<>\"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;' }[c]));\n  const store = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { /* abaikan */ } return null; };\n  const guru = /[?&]guru\\b/.test((window.__QS||''));\n\n  let prog = {}; try { prog = JSON.parse(store('ss-prog') || '{}') || {}; } catch (e) { prog = {}; }   // {idx: {s:bintang, k:true bila dilewati}}\n  let mode = store('ss-mode') === 'latihan' ? 'latihan' : 'tantangan';\n  let ri = 0, stageSel = 0, scene = null, targets = [], solved = false, hintUsed = false, t0 = 0, sessionScore = 0, tickT = 0, misses = 0, gone = false;\n  const demo = $('#demo'), inp = $('#sel'), dw = $('#dw'), ovl = $('#ovl');\n\n  const saveProg = () => store('ss-prog', JSON.stringify(prog));\n  const totalStars = () => Object.keys(prog).reduce((n, k) => n + (prog[k].s || 0), 0);\n\n/* ================= EFEK VISUAL ================= */\n  const fx = $('#fx'), RM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;\n  let hiddenNodes = [];\n  function fxClear() { fx.innerHTML = ''; hiddenNodes.forEach(n => { n.style.visibility = ''; }); hiddenNodes = []; }\n  const rnd = (a, b) => a + Math.random() * (b - a);\n  function shatter(nodes) {\n    fxClear(); ovl.innerHTML = ''; ovMap.clear(); gone = true;\n    const COL = ['#fde047', '#fb923c', (st, q, fields, hint, note, par) => rounds.push({ st, q, fields, hint, note, par: par || 60, ans: fields.map(f => f.label + ' = ' + C(f.ans)).join(', ') });\n\n  /* Tahap 1: netmask & CIDR */\n  [26, 27, 20, 22].forEach(p => add(0, 'Tulis <b>netmask</b> dari prefix <span class=\"ipb\">/' + p + '</span>', [F('m', 'Netmask', str(mask(p)))],\n    'Tulis ' + p + ' angka 1 berurutan lalu bagi per 8 bit.', '<ol><li>' + p + ' bit 1 = ' + C(bin(mask(p))) + '.</li><li>Ubah tiap oktet ke desimal → ' + C(str(mask(p))) + '.</li></ol>', 45));\n  [224, 248].forEach(o => { const p = 24 + (o === 224 ? 3 : 5); add(0, 'Berapa <b>prefix</b> (angka setelah /) dari netmask <span class=\"ipb\">255.255.255.' + o + '</span>?', [F('p', 'Prefix /', p, NUM)],\n    'Hitung jumlah bit 1: 255 = 8 bit; ' + o + ' = ' + o.toString(2) + '.', '<ol><li>255.255.255 = 24 bit 1.</li><li>' + o + ' = ' + C(o.toString(2)) + ' → ' + (p - 24) + ' bit 1.</li><li>Total ' + p + ' → ' + C('/' + p) + '.</li></ol>', 45); });\n  /* Tahap 2: jumlah host */\n  [[26], [27], [28], [22], [30]].forEach(([p]) => add(1, 'Pada jaringan <span class=\"ipb\">/' + p + '</span>, berapa <b>total alamat</b> dan <b>host yang bisa dipakai</b>?',\n    [F('t', 'Total alamat', Math.pow(2, 32 - p), NUM), F('h', 'Host usable', Math.pow(2, 32 - p) - 2, NUM)],\n    'Bit host = 32 − ' + p + ' = ' + (32 - p) + '. Total = 2^bit host.', '<ol><li>Bit host = 32 − ' + p + ' = ' + (32 - p) + '.</li><li>Total alamat = 2<sup>' + (32 - p) + '</sup> = ' + Math.pow(2, 32 - p) + '.</li><li>Host usable = total − 2 (network &amp; broadcast) = ' + (Math.pow(2, 32 - p) - 2) + '.</li></ol>', 60));\n  /* Tahap 3: network & broadcast */\n  ['192.168.10.77/26', '192.168.1.130/25', '192.168.5.99/28', '172.20.200.17/22', '172.16.45.200/20', '10.20.30.40/12'].forEach(s => {\n    const [x, p] = s.split('/'), a = ip(x), pp = +p;\n    add(2, 'Tentukan <b>alamat network</b> dan <b>broadcast</b> dari <span class=\"ipb\">' + s + '</span>', [F('n', 'Network', str(net(a, p  color:#fff; }\n  .btn.primary { background:var(--brand); } .btn.ok { background:var(--ok); } .btn.ghost { background:#fff; color:#334155; border:1px solid #cbd5e1; } .btn:disabled { opacity:.45; }\n  .msg { padding:8px 12px; border-radius:8px; font-size:14px; margin:8px 0; }\n  .msg.ok { background:#dcfce7; color:#166534; } .msg.bad { background:#fee2e2; color:#991b1b; } .msg.info { background:#e0e7ff; color:#3730a3; } .msg.warn { background:#fef3c7; color:#92400e; }\n  .note { background:#f8fafc; border-left:4px solid var(--sc); padding:8px 12px; border-radius:6px; font-size:14px; margin:8px 0; }\n  .mutedtxt { color:var(--muted); font-size:13px; }\n  .keys { display:flex; gap:5px; flex-wrap:wrap; margin:8px 0; }\n  .keys button { min-width:38px; height:36px; border:1px solid #cbd5e1; background:#f8fafc; border-radius:8px; font:600 14px ui-monospace,Menlo,Consolas,monospace; color:#334155; padding:0 8px; } .keys button:active { background:#e0e7ff; }\n  .code { width:100%; font:15px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; border:2px solid #334155; border-radius:10px; padding:10px 12px; background:#0f172a; color:#e2e8f0; resize:vertical; }\n  .code:focus { outline:3px solid #a5b4fc; border-color:var(--brand); }\n  table.ch { border-collapse:collapse; width:100%; font-size:13px; margin-top:8px; } table.ch th, table.ch td { border:1px solid var(--line); padding:5px 8px; text-align:left; vertical-align:top; } table.ch th { background:#f1f5f9; }\n  details.cheat summary { cursor:pointer; font-weight:700; font-size:14px; }\n  @keyframes shk { 0%,100% { transform:translateX(0); } 15% { transform:translateX(-8px); } 35% { transform:translateX(7px); } 55% { transform:translateX(-5px); } 75% { transform:translateX(3px); } }\n  .shk { animation:shk .5s ease-in-out; }\n  @keyframes pop { 0% { transform:scale(1); } 40% { transform:scale(1.04); } 100% { transform:scale(1); } }\n  .pop { animation:pop .5s ease-out; }\n  .big { font-size:30px; font-weight:800; } >\n    </div>\n  </div>\n  <details class=\"panel cheat\" id=\"cheat\" open><summary>📚 Contekan</summary><div id=\"cheatbody\" style=\"overflow:auto\"></div></details>\n</main>\n<script>\n(function () {\n  const DIRS = [[1, 0], [0, 1], [-1, 0], [0, -1]];\n  const BASE = ['maju', 'kiri', 'kanan'];\n  const mkBlocks = s => s.trim().split(/\\s+/).map(w => { let m; if (w === '}') return { t: 'tutup' }; if ((m = /^ulangi(\\d+)\\{$/.exec(w))) return { t: 'ulangi', n: +m[1] }; if (w.endsWith('{')) return { t: w.slice(0, -1) }; return { t: w }; });\n  const used = bl => bl.filter(b => b.t !== 'tutup').length;\n  const L = (st, t, goal, grid, sol, allow, hint, note, extra) => { const bl = mkBlocks(sol), opt = used(bl); return Object.assign({ st, t, goal, grid, dir: 0, sol: bl, allow, opt, limit: opt + (st === 0 ? 3 : 1), hint, note, par: 150 }, extra || {}); };\n  const A1 = BASE.concat(['ulangi']), A2 = BASE.concat(['sampai', 'jikaDepan', 'jikaTembok']), A2b = A2.concat(['jikaKanan', 'jikaKiri']), A3 = BASE.concat(['fungsi', 'panggil']), A4 = BASE.concat(['ulangi', 'sampai', 'jikaDepan', 'jikaTembok', 'jikaKanan', 'jikaKiri', 'fungsi', 'panggil']);\n  const rounds = [\n    L(0, 'Jalan lurus', 'Antar robot ke ⭐ dengan blok <b>maju</b>.', ['S..G'], 'maju maju maju', BASE, 'Ada 3 petak kosong sebelum ⭐ — 3 kali maju.', 'Program = urutan perintah yang dijalankan <b>satu per satu</b> dari atas ke bawah.'),\n    L(0, 'Belok kanan', 'Robot menghadap ke kanan (timur). Belok dengan <b>belokKanan</b>.', ['S..', '##.', '##G'], 'maju maju kanan maju maju', BASE, 'Maju 2, belok kanan, maju 2.', '<code>belokKanan()</code> memutar arah hadap 90° searah jarum jam.'),\n    L(0, 'Zig-zag', 'Ikuti jalan berkelok ke ⭐.', ['S.#', '#.#', '#.G'], 'maju kanan maju maju kiri maju', BASE, 'Maju 1, kanan, maju 2, kiri, maju 1.', 'Urutan perintah menentukan hasil: menukar dua perintah bisa membuat robot menabrak.'),\n    L(0, 'Huruf U', 'Robot berputar balik membentuk huruf U.', ['S..', '##.', 'G..'],
